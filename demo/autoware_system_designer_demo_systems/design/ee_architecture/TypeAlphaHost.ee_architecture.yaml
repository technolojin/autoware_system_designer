autoware_system_design_format: 0.5.0

name: TypeAlphaHost.ee_architecture

description: One ECU running each compute unit in its own container, on the ECU's network and shared memory.

devices:
  - name: ecu
    hardware: x86_64
    environments:
      - name: main
        kind: container
        shared_memory: true
        daemon_port: 8781
      - name: sub_1
        kind: container
        shared_memory: true
        daemon_port: 8782
      - name: sub_2
        kind: container
        shared_memory: true
        daemon_port: 8783

main_environment: ecu/main

bindings:
  - compute_unit: main_ecu
    environment: ecu/main
  - compute_unit: sub_ecu_1
    environment: ecu/sub_1
  - compute_unit: sub_ecu_2
    environment: ecu/sub_2
