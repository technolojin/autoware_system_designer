autoware_system_design_format: 0.5.0

base: TypeAlpha.system

ee_architectures:
  - TypeAlphaHost.ee_architecture
  - TypeAlphaNativeMain.ee_architecture
  - TypeAlphaBridge.ee_architecture
  - TypeAlphaLocalPair.ee_architecture
  - TypeAlphaRemotePair.ee_architecture
  - TypeAlphaSharedEnvironment.ee_architecture

# One deploy per hardware variant of vehicle_x; each takes its peripheral arguments from its E/E architecture.
deploy_list:
  - name: vehicle_x
    ee_architecture: TypeAlphaBridge.ee_architecture
    arguments: &vehicle_x
      - name: vehicle_id
        value: vehicle_x
      - name: individual_params_path
        value: $(find-pkg-share autoware_system_designer_demo_systems)/config/individual_params/vehicle_x
      - name: data_path
        value: $(env HOME)/autoware_data/ml_models
      - name: lanelet2_map_file
        value: lanelet2_map.osm
      - name: pointcloud_map_file
        value: pointcloud_map.pcd
  - name: vehicle_x_host
    ee_architecture: TypeAlphaHost.ee_architecture
    arguments: *vehicle_x
  - name: vehicle_x_native_main
    ee_architecture: TypeAlphaNativeMain.ee_architecture
    arguments: *vehicle_x
  - name: vehicle_x_local_pair
    ee_architecture: TypeAlphaLocalPair.ee_architecture
    arguments: *vehicle_x
  - name: vehicle_x_remote_pair
    ee_architecture: TypeAlphaRemotePair.ee_architecture
    arguments: *vehicle_x
  - name: vehicle_x_shared_environment
    ee_architecture: TypeAlphaSharedEnvironment.ee_architecture
    arguments: *vehicle_x
