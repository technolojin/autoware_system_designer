# Services of the multi-unit environment: the workspace build and the daemon of one execution
# environment. run.py runs the build from this file and derives a project per E/E architecture
# whose services extend "unit"; it supplies the source checkout and the site directory, which
# holds the SSH keys.
services:
  build:
    image: asd-multi-unit:${ASD_ROS_DISTRO:-humble}
    build: &image
      context: ${ASD_SOURCE_DIR:?source checkout, set by run.py}
      dockerfile: demo/docker_multi_unit/Dockerfile
      args:
        ROS_DISTRO: ${ASD_ROS_DISTRO:-humble}
        UID: ${ASD_UID:-1000}
        GID: ${ASD_GID:-1000}
    command: build
    init: true
    environment:
      ASD_PACKAGES: ${ASD_PACKAGES:-}
    volumes:
      - ${ASD_SOURCE_DIR:?source checkout, set by run.py}:/ws/src/autoware_system_designer:ro
      - ws:/ws/out

  # Daemon of the environment ASD_ENVIRONMENT of the E/E architecture ASD_EE_ARCHITECTURE.
  unit:
    image: asd-multi-unit:${ASD_ROS_DISTRO:-humble}
    build: *image
    command: serve
    init: true
    stop_grace_period: 20s
    environment:
      ROS_DOMAIN_ID: ${ASD_ROS_DOMAIN_ID:-87}
      ASD_RMW_IMPLEMENTATION: ${ASD_RMW_IMPLEMENTATION:-}
      ASD_SSHD_PORT: ${ASD_SSHD_PORT:-2222}
    volumes:
      - ${ASD_SOURCE_DIR:?source checkout, set by run.py}:/ws/src/autoware_system_designer:ro
      - ws:/ws/out
      - ${ASD_SITE_DIR:?directory of the keys, made by run.py}:/run/asd/site:ro

volumes:
  # Built workspace, shared by every architecture and kept per ROS distribution.
  ws:
    name: asd-multi-unit-ws-${ASD_ROS_DISTRO:-humble}
