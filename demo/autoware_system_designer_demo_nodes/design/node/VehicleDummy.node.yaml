autoware_system_design_format: 0.4.0

name: VehicleDummy.node

description: Dummy vehicle interface that consumes the control command and publishes IMU and odometry at fixed rates.

package:
  name: autoware_system_designer_demo_nodes
  provider: dummy

launch:
  plugin: autoware::system_designer_demo_nodes::Vehicle
  executable: vehicle_node

# interfaces
subscribers:
  - name: control_cmd
    message_type: std_msgs/msg/Float32

publishers:
  - name: imu
    message_type: std_msgs/msg/Float64MultiArray
  - name: odometry
    message_type: std_msgs/msg/Float64MultiArray

param_files: []

param_values:
  - name: can_interface
    type: string
    default: ""
    description: CAN interface of the vehicle controller bus.

# processes
processes:
  - name: drive
    trigger_conditions:
      - on_input: control_cmd
    outcomes:
      - terminal:
  - name: imu
    trigger_conditions:
      - periodic: 100.0 # Hz
    outcomes:
      - to_output: imu
  - name: odometry
    trigger_conditions:
      - periodic: 50.0 # Hz
    outcomes:
      - to_output: odometry
