autoware_system_design_format: 0.5.0

name: CameraDummyDriver.node

description: Dummy camera driver that periodically publishes raw image, compressed image and camera info.

package:
  name: autoware_system_designer_demo_nodes
  provider: dummy

launch:
  plugin: autoware::system_designer_demo_nodes::CameraDummyDriver
  executable: camera_driver_node

# interfaces
subscribers: []
publishers:
  - name: image
    message_type: std_msgs/msg/UInt8MultiArray
    message_size: 6.2M
    qos:
      reliability: best_effort
      durability: volatile
  - name: compressed_image
    message_type: std_msgs/msg/ByteMultiArray
    message_size: 600k
  - name: camera_info
    message_type: std_msgs/msg/Header
    message_size: 400

param_files: []

param_values:
  - name: composable_node
    type: bool
    default: false
  - name: device
    type: string
    default: ""
    description: Interface of the camera link on the host.

# processes
processes:
  - name: camera
    trigger_conditions:
      - periodic: 10.0 # Hz
        warn_rate: 0.3 # Hz
        error_rate: 0.3 # Hz
        timeout: 0.5 # s
    outcomes:
      - to_output: image
      - to_output: compressed_image
      - to_output: camera_info
