autoware_system_design_format: 0.4.0

name: Mismatch.system

description: Connection declares publisher/subscriber over service ports.

modes:
  - name: default
    description: Default mode
    default: true

components:
  - name: provider
    entity: Provider.node
    compute_unit: main_ecu
  - name: consumer
    entity: Consumer.node
    compute_unit: main_ecu

connections:
  - - provider.publisher.set_mode
    - consumer.subscriber.set_mode
